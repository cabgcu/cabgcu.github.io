<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Canyon Activities Board</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Import a clean sans-serif font similar to the screenshot */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-color: #000000;
            --text-color: #f8fafc;
        }

        html {
            height: 100%;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Hide scrollbar for the horizontal navigation */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="antialiased flex justify-center items-center">

    <!-- Background Decoration -->
    <div class="fixed top-[-10%] left-[-10%] w-[40vw] h-[40vw] rounded-full bg-white/5 blur-[100px] pointer-events-none -z-10"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-white/5 blur-[120px] pointer-events-none -z-10"></div>

    <main class="w-full max-w-md min-h-[100dvh] relative flex flex-col overflow-x-hidden overflow-y-auto bg-black md:rounded-3xl md:my-8 border-x border-white/5 md:border-y shadow-[0_8px_32px_0_rgba(0,0,0,0.5)] no-scrollbar">

        <div class="relative w-full h-[60vh] sm:h-[65vh] shrink-0">
            <!-- Hero video -->
            <video
                src="https://i.imgur.com/qY8V0Ou.mp4"
                class="w-full h-full object-cover object-center opacity-90"
                autoplay
                loop
                muted
                playsinline
            ></video>
            <!-- Gradient overlay to fade smoothly into the black background below -->
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
        </div>

        <div class="relative z-10 flex flex-col items-center px-6 -mt-48 mb-12 flex-grow justify-start">
            <img src="https://i.imgur.com/p2qZOL5.png" alt="Canyon Activities Board Logo" class="h-16 sm:h-20 w-auto mb-3 drop-shadow-2xl">
            <h1 class="text-xl sm:text-2xl md:text-3xl font-extrabold tracking-tight text-white mb-2 text-center drop-shadow-lg whitespace-nowrap">
                Canyon Activities Board
            </h1>
            <p class="text-white/90 text-sm text-center mb-2 max-w-sm leading-snug drop-shadow-md">
                Bringing fun, community, &amp; excellence to the @gcu experience — one event at a time.
            </p>
            <p class="text-gray-300 text-sm md:text-base font-medium mb-4 tracking-wide drop-shadow-sm">
                @cabgcu
            </p>

            <div class="flex items-center justify-center gap-4 w-full">
                <a href="https://instagram.com/cabgcu" target="_blank" rel="noopener" class="text-white hover:text-gray-300 transition-colors transform hover:scale-110 flex items-center justify-center w-10 h-10" aria-label="Instagram">
                    <i class="fa-brands fa-instagram text-2xl"></i>
                </a>
                <a href="https://www.tiktok.com/@cabgcu" target="_blank" rel="noopener" class="text-white hover:text-gray-300 transition-colors transform hover:scale-110 flex items-center justify-center w-10 h-10" aria-label="TikTok">
                    <i class="fa-brands fa-tiktok text-xl"></i>
                </a>
            </div>

            <!-- Quick Access Links -->
            <div class="w-full max-w-[320px] flex flex-col gap-3 mt-8 pb-8">
                <a href="https://cabgcu.github.io/calendar/" target="_blank" rel="noopener" class="w-full bg-white/10 hover:bg-white/20 border border-white/20 text-white font-semibold py-3.5 px-6 rounded-full transition-all transform hover:-translate-y-1 backdrop-blur-md shadow-lg text-center flex justify-between items-center group">
                    <span class="flex-grow text-center">Upcoming Events</span>
                    <i class="fa-solid fa-chevron-right text-xs opacity-50 group-hover:opacity-100 group-hover:translate-x-1 transition-all absolute right-6"></i>
                </a>

                <a href="#" class="w-full bg-white/10 hover:bg-white/20 border border-white/20 text-white font-semibold py-3.5 px-6 rounded-full transition-all transform hover:-translate-y-1 backdrop-blur-md shadow-lg text-center flex justify-between items-center group">
                    <span class="flex-grow text-center">Buy Tickets</span>
                    <i class="fa-solid fa-chevron-right text-xs opacity-50 group-hover:opacity-100 group-hover:translate-x-1 transition-all absolute right-6"></i>
                </a>

                <a href="#" class="w-full bg-white/10 hover:bg-white/20 border border-white/20 text-white font-semibold py-3.5 px-6 rounded-full transition-all transform hover:-translate-y-1 backdrop-blur-md shadow-lg text-center flex justify-between items-center group">
                    <span class="flex-grow text-center">Volunteer with CAB</span>
                    <i class="fa-solid fa-chevron-right text-xs opacity-50 group-hover:opacity-100 group-hover:translate-x-1 transition-all absolute right-6"></i>
                </a>

                <a href="https://www.gcu.edu" target="_blank" rel="noopener" class="w-full bg-white/10 hover:bg-white/20 border border-white/20 text-white font-semibold py-3.5 px-6 rounded-full transition-all transform hover:-translate-y-1 backdrop-blur-md shadow-lg text-center flex justify-between items-center group">
                    <span class="flex-grow text-center">GCU Website</span>
                    <i class="fa-solid fa-chevron-right text-xs opacity-50 group-hover:opacity-100 group-hover:translate-x-1 transition-all absolute right-6"></i>
                </a>
            </div>
        </div>

    </main>

</body>
</html>
