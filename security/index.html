<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAB Security</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black text-slate-100 font-sans antialiased overflow-x-hidden min-h-screen flex flex-col justify-between selection:bg-sky-500/30 selection:text-sky-200">

    <!-- Minimal Top Header -->
    <header class="relative z-20 w-full max-w-4xl mx-auto px-5 pt-6 pb-2 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <span id="global-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 shadow-[0_0_12px_rgba(251,191,36,0.9)] animate-pulse"></span>
            <div>
                <h1 class="text-sm font-semibold tracking-[0.16em] uppercase text-sky-100">CAB Security</h1>
                <p id="global-status" class="text-xs text-slate-400">Security Monitor • loading real data...</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Always-accessible Clear Results Button -->
            <button id="btn-clear-all" type="button"
                class="px-3 py-2 rounded-xl bg-zinc-950 hover:bg-zinc-900 border border-zinc-800 text-slate-300 hover:text-emerald-300 hover:border-emerald-500/40 text-xs font-medium transition-all active:scale-95">
                Clear
            </button>

            <!-- Toggle Activity Log Drawer -->
            <button id="btn-log-toggle" type="button"
                class="px-3 py-2 rounded-xl bg-zinc-950 hover:bg-zinc-900 border border-zinc-800 text-slate-300 hover:text-sky-200 text-xs font-medium transition-all flex items-center gap-1.5 active:scale-95">
                <span>Activity</span>
                <span id="log-count" class="px-1.5 py-0.5 rounded-md bg-sky-500/15 text-sky-300 font-mono text-[10px]">0</span>
            </button>

            <!-- Minimal Audio Toggle -->
            <button id="btn-sound" type="button" aria-label="Toggle Audio"
                class="p-2 rounded-xl bg-zinc-950 hover:bg-zinc-900 border border-zinc-800 text-slate-400 hover:text-sky-300 transition-all active:scale-95">
                <svg id="icon-sound-off" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                </svg>
                <svg id="icon-sound-on" class="w-4 h-4 hidden text-sky-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Subtle Non-Blocking Toast -->
    <div id="toast-box" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-300">
        <div class="px-4 py-1.5 rounded-full bg-zinc-950/95 border border-sky-400/35 text-sky-100 text-xs font-medium shadow-[0_0_24px_rgba(14,165,233,0.25)] backdrop-blur-md">
            <span id="toast-message">Scan Complete</span>
        </div>
    </div>

    <!-- Centerpiece: Storytelling Interactive Orb + Per-Site Bidirectional Traffic -->
    <main class="relative flex-1 flex flex-col items-center justify-center w-full max-w-4xl mx-auto px-4 py-2 pb-8">
        <!-- Responsive Orb & Site Traffic Canvas -->
        <div id="orb-stage" class="relative w-full h-[58vh] min-h-[380px] max-h-[620px] flex items-center justify-center cursor-pointer select-none touch-none">
            <canvas id="orb-canvas" class="w-full h-full block"></canvas>

            <!-- Subtle Traffic Flow Legend (shown once real site data is loaded) -->
            <div id="flow-legend" class="hidden pointer-events-none absolute top-1 right-2 px-2.5 py-1 rounded-full bg-zinc-950/80 border border-zinc-800/80 text-[10px] text-slate-400 backdrop-blur-sm flex items-center gap-3">
                <span id="live-badge" class="flex items-center gap-1.5 text-emerald-300 font-medium"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span><span>Live (10m)</span></span>
                <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-sky-400"></span>In</span>
                <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>Out</span>
                <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>Failed</span>
            </div>

            <!-- Subtle Bottom Hint (fades after interaction) -->
            <div id="orb-hint" class="pointer-events-none absolute bottom-1 px-3 py-1 rounded-full bg-black/70 border border-zinc-800/80 text-[11px] text-slate-400 backdrop-blur-sm transition-opacity duration-500">
                Tap orb to sweep • Tap a site node to inspect
            </div>
        </div>

        <!-- AI Agent Narrative Line (Tells the current visual story) -->
        <div class="w-full max-w-xl text-center mt-1 mb-4 px-2">
            <p id="story-headline" class="text-sm sm:text-base text-sky-100/95 font-light leading-relaxed min-h-[2.5rem] transition-opacity duration-300">
                "Sign in to read the live request log."
            </p>
        </div>

        <!-- 4 Clean Focus Pills (Overview, Traffic, Brevo, Supabase) -->
        <nav aria-label="System Focus" class="w-full max-w-xl grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">
            <button type="button" data-focus="overview"
                class="focus-btn p-3 rounded-2xl border transition-all text-left active:scale-95 bg-sky-500/15 border-sky-400/40 text-sky-100">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] uppercase tracking-wider font-medium text-sky-300">Overview</span>
                    <span id="dot-overview" class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                </div>
                <div id="pill-overview" class="text-xs font-mono text-slate-200 mt-1">...</div>
            </button>

            <button type="button" data-focus="traffic"
                class="focus-btn p-3 rounded-2xl border transition-all text-left active:scale-95 bg-zinc-950/90 border-zinc-800/90 text-slate-300 hover:border-zinc-700">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] uppercase tracking-wider font-medium text-slate-400">Traffic</span>
                    <span id="dot-traffic" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                </div>
                <div id="pill-traffic" class="text-xs font-mono text-slate-200 mt-1">...</div>
            </button>

            <button type="button" data-focus="brevo"
                class="focus-btn p-3 rounded-2xl border transition-all text-left active:scale-95 bg-zinc-950/90 border-amber-500/35 text-slate-300 hover:border-amber-400/60">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] uppercase tracking-wider font-medium text-amber-300">Brevo</span>
                    <span id="dot-brevo" class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping"></span>
                </div>
                <div id="pill-brevo" class="text-xs font-mono text-amber-200 mt-1">...</div>
            </button>

            <button type="button" data-focus="supabase"
                class="focus-btn p-3 rounded-2xl border transition-all text-left active:scale-95 bg-zinc-950/90 border-zinc-800/90 text-slate-300 hover:border-zinc-700">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] uppercase tracking-wider font-medium text-slate-400">Supabase</span>
                    <span id="dot-supabase" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                </div>
                <div id="pill-supabase" class="text-xs font-mono text-slate-200 mt-1">...</div>
            </button>
        </nav>

        <!-- Single Context-Aware Detail Strip (Only shows what you're focused on) -->
        <section id="detail-strip" class="w-full max-w-xl p-4 rounded-2xl bg-zinc-950/90 border border-zinc-800/90 backdrop-blur-xl transition-all">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div id="detail-metrics" class="flex flex-wrap items-center gap-x-5 gap-y-2 text-xs font-mono">
                    <!-- Dynamically populated based on active focus -->
                </div>
                <div id="detail-actions" class="flex items-center gap-2">
                    <!-- Dynamically populated quick action -->
                </div>
            </div>
        </section>

        <!-- Expandable Minimal Activity Log (Hidden by default for clean canvas) -->
        <aside id="activity-drawer" class="hidden w-full max-w-xl mt-3 p-4 rounded-2xl bg-zinc-950/95 border border-zinc-800 backdrop-blur-xl">
            <div class="flex items-center justify-between pb-2.5 mb-2.5 border-b border-zinc-800/80">
                <span class="text-xs font-medium uppercase tracking-wider text-sky-200">Alerts and live requests</span>
                <div class="flex items-center gap-2">
                    <button id="btn-clear-flags" type="button" class="px-2.5 py-1 rounded-lg bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border border-emerald-500/30 text-[11px] transition-all active:scale-95">Clear All</button>
                </div>
            </div>
            <div id="log-list" class="max-h-36 overflow-y-auto space-y-2 font-mono text-[11px] pr-1">
                <!-- Populated dynamically -->
            </div>
        </aside>
    </main>

    <!-- Interactive Storytelling Orb & Per-Site Traffic Hub Logic -->
    <script>
        (function () {
            'use strict';

            // DOM Elements
            const canvas = document.getElementById('orb-canvas');
            const ctx = canvas.getContext('2d');
            const stage = document.getElementById('orb-stage');
            const globalDot = document.getElementById('global-dot');
            const globalStatus = document.getElementById('global-status');
            const storyHeadline = document.getElementById('story-headline');
            const orbHint = document.getElementById('orb-hint');
            const flowLegend = document.getElementById('flow-legend');
            const liveBadge = document.getElementById('live-badge');
            const focusButtons = document.querySelectorAll('.focus-btn');
            const detailMetrics = document.getElementById('detail-metrics');
            const detailActions = document.getElementById('detail-actions');
            const activityDrawer = document.getElementById('activity-drawer');
            const logToggleBtn = document.getElementById('btn-log-toggle');
            const logCountEl = document.getElementById('log-count');
            const logListEl = document.getElementById('log-list');
            const clearFlagsBtn = document.getElementById('btn-clear-flags');
            const clearAllBtn = document.getElementById('btn-clear-all');
            const soundBtn = document.getElementById('btn-sound');
            const iconSoundOff = document.getElementById('icon-sound-off');
            const iconSoundOn = document.getElementById('icon-sound-on');
            const toastBox = document.getElementById('toast-box');
            const toastMessage = document.getElementById('toast-message');

            // Pill status elements
            const pillOverview = document.getElementById('pill-overview');
            const pillTraffic = document.getElementById('pill-traffic');
            const pillBrevo = document.getElementById('pill-brevo');
            const pillSupabase = document.getElementById('pill-supabase');
            const dotOverview = document.getElementById('dot-overview');
            const dotTraffic = document.getElementById('dot-traffic');
            const dotBrevo = document.getElementById('dot-brevo');
            const dotSupabase = document.getElementById('dot-supabase');

            // Harmonious accent hues assigned deterministically per site
            const SITE_PALETTE = [196, 174, 218, 252, 160, 282, 186, 232];
            // Only events within the last 10 minutes count as live connections (matches rpm10)
            const LIVE_WINDOW_MS = 10 * 60 * 1000;

            // Visual & Animation State
            const orb = {
                width: 0,
                height: 0,
                cx: 0,
                cy: 0,
                baseRadius: 150,
                time: 0,
                frame: 0,
                // Story focus: 'overview' | 'traffic' | 'brevo' | 'supabase'
                focus: 'overview',
                selectedSite: null, // Optional site key when user clicks a site node
                hoveredSite: null,
                isScanning: false,
                scanAngle: 0,
                // Smoothly interpolated visual traits
                hue: 205,
                targetHue: 205,
                speed: 0.9,
                targetSpeed: 0.9,
                turbulence: 0.12,
                targetTurbulence: 0.12,
                scale: 1.0,
                targetScale: 1.0,
                // Pointer magnetism & hold-to-scan
                pointerX: 0,
                pointerY: 0,
                pointerActive: false,
                isHolding: false,
                holdLevel: 0,
                // Visual collections
                pulses: [],
                latticeNodes: [],
                flowParticles: [],
                siteNodes: [],      // Only sites with live connections within LIVE_WINDOW_MS
                sitePackets: [],    // Real directional packets: Site -> Orb (IN) then Orb -> Site (OUT)
                impactSparks: [],   // Subtle flashes when packets enter/leave the orb or site
                seenEventKeys: new Set(),
                hasSeededLive: false,
                lastPruneTime: 0,
                satellites: [
                    { key: 'traffic', angle: -Math.PI * 0.75, label: 'TRAFFIC' },
                    { key: 'brevo', angle: -Math.PI * 0.25, label: 'BREVO' },
                    { key: 'supabase', angle: Math.PI * 0.5, label: 'SUPABASE' }
                ],
                // Audio & Timers
                soundEnabled: false,
                audioCtx: null,
                toastTimer: null
            };

            // System Monitoring State (Connected to live Supabase Security Gateway)
            const GW = 'https://csutspaxezmjbqynpprt.supabase.co/functions/v1/security-gateway';
            const hub = {
                traffic: { rpm: 0, req24: 0, failed24: 0, denied24: 0, alert: false },
                brevo: { sent: 0, recipients: 0, flagged: 0, frozen: false },
                supabase: { storageGB: 0, quotaGB: 0.5, dbMB: 0 },
                alerts: [],
                recent: [],
                logs: [],
                by_app: {},
                openCount: 0,
                ai: false,
                loaded: false,
                err: '',
                clearedAt: Number(sessionStorage.getItem('sec_cleared_at') || 0)
            };

            /**
             * Non-blocking toast notification.
             */
            function showToast(msg) {
                toastMessage.textContent = msg;
                toastBox.classList.remove('opacity-0');
                clearTimeout(orb.toastTimer);
                orb.toastTimer = setTimeout(() => {
                    toastBox.classList.add('opacity-0');
                }, 2200);
            }

            /**
             * Gentle Web Audio chime for tactile feedback when audio is enabled.
             */
            function playTone(freq = 440, duration = 0.22, type = 'sine') {
                if (!orb.soundEnabled) return;
                try {
                    if (!orb.audioCtx) {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        orb.audioCtx = new AudioCtx();
                    }
                    if (orb.audioCtx.state === 'suspended') orb.audioCtx.resume();
                    const osc = orb.audioCtx.createOscillator();
                    const gain = orb.audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, orb.audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(freq * 1.18, orb.audioCtx.currentTime + duration);
                    gain.gain.setValueAtTime(0.06, orb.audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, orb.audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(orb.audioCtx.destination);
                    osc.start();
                    osc.stop(orb.audioCtx.currentTime + duration);
                } catch (err) {
                    console.warn('Audio unavailable:', err);
                }
            }

            /**
             * Emits an energy ripple from the orb.
             */
            function triggerPulse(strength = 1.0, customHue = null) {
                orb.pulses.push({
                    radius: orb.baseRadius * 0.85,
                    maxRadius: orb.baseRadius * (1.9 + strength * 0.45),
                    alpha: Math.min(0.95, 0.72 * strength),
                    hue: customHue
                });
                playTone(280 + strength * 50, 0.26, 'triangle');
                if (orbHint) orbHint.classList.add('opacity-0');
            }

            /**
             * Spawns a subtle spark at (x, y) when a packet arrives at the orb or site.
             */
            function spawnSpark(x, y, hue, isFailed = false) {
                orb.impactSparks.push({
                    x,
                    y,
                    radius: isFailed ? 4 : 3,
                    maxRadius: isFailed ? 18 : 14,
                    alpha: isFailed ? 0.95 : 0.8,
                    hue
                });
            }

            /**
             * Formats a site/app key into a clean display label.
             */
            function formatSiteLabel(key) {
                return String(key || 'unknown')
                    .replace(/[-_]+/g, ' ')
                    .replace(/\b\w/g, c => c.toUpperCase());
            }

            /**
             * Rebuilds ONLY live site nodes (active within LIVE_WINDOW_MS and after clearedAt)
             * from real hub.recent events, emitting real IN packets for newly arrived requests.
             */
            function rebuildSiteNodes() {
                const now = Date.now();
                const liveMap = {};
                const freshEvents = [];

                (hub.recent || []).forEach(r => {
                    if (!r || !r.app) return;
                    const tsMs = new Date(r.ts).getTime();
                    if (!Number.isFinite(tsMs) || (now - tsMs) > LIVE_WINDOW_MS) return;
                    if (hub.clearedAt && tsMs <= hub.clearedAt) return;

                    const key = String(r.app);
                    if (!liveMap[key]) {
                        liveMap[key] = {
                            key,
                            label: formatSiteLabel(key),
                            liveReq: 0,
                            liveFailed: 0,
                            failed: 0,
                            openAlerts: 0,
                            lastTs: tsMs,
                            lastAction: r.action || 'request'
                        };
                    }
                    liveMap[key].liveReq++;
                    if (r.ok === false) {
                        liveMap[key].liveFailed++;
                        liveMap[key].failed++;
                    }
                    if (tsMs >= liveMap[key].lastTs) {
                        liveMap[key].lastTs = tsMs;
                        liveMap[key].lastAction = r.action || 'request';
                    }

                    const evKey = r.id != null
                        ? String(r.id)
                        : [r.ts, r.app, r.action || '', r.status || '', r.ip || ''].join('|');

                    if (!orb.seenEventKeys.has(evKey)) {
                        orb.seenEventKeys.add(evKey);
                        freshEvents.push({ key, failed: r.ok === false, tsMs });
                    }
                });

                // Keep seenEventKeys bounded over long sessions
                if (orb.seenEventKeys.size > 400) {
                    orb.seenEventKeys = new Set(Array.from(orb.seenEventKeys).slice(-200));
                }

                // Attach open alert counts only to currently live sites
                (hub.alerts || []).forEach(a => {
                    if (!a || !a.app || a.status !== 'open') return;
                    const key = String(a.app);
                    if (liveMap[key]) liveMap[key].openAlerts++;
                });

                const entries = Object.values(liveMap).sort((a, b) => b.lastTs - a.lastTs || b.liveReq - a.liveReq);
                const maxLive = Math.max(1, ...entries.map(e => e.liveReq));

                const prevByKey = {};
                orb.siteNodes.forEach(n => { prevByKey[n.key] = n; });

                const count = entries.length;
                orb.siteNodes = entries.map((entry, idx) => {
                    let angle;
                    if (count === 1) {
                        angle = 0;
                    } else if (count === 2) {
                        angle = idx === 0 ? Math.PI : 0;
                    } else if (count === 3) {
                        angle = [-Math.PI * 0.78, -Math.PI * 0.22, Math.PI * 0.5][idx];
                    } else if (count === 4) {
                        angle = [-Math.PI * 0.76, -Math.PI * 0.24, Math.PI * 0.24, Math.PI * 0.76][idx];
                    } else {
                        angle = -Math.PI / 2 + (idx / count) * Math.PI * 2;
                    }

                    const prev = prevByKey[entry.key];
                    const volumeRatio = Math.max(0.2, Math.sqrt(entry.liveReq / maxLive));
                    const failRatio = entry.liveReq > 0 ? Math.min(1, entry.liveFailed / entry.liveReq) : 0;

                    return {
                        ...entry,
                        angle,
                        hue: prev ? prev.hue : SITE_PALETTE[idx % SITE_PALETTE.length],
                        volumeRatio,
                        failRatio,
                        x: prev ? prev.x : orb.cx,
                        y: prev ? prev.y : orb.cy,
                        radius: 15,
                        pulse: prev ? prev.pulse : 0.6
                    };
                });

                // Clear selectedSite if it is no longer live
                if (orb.selectedSite && !orb.siteNodes.some(n => n.key === orb.selectedSite)) {
                    orb.selectedSite = null;
                }

                // Update live legend badge
                if (flowLegend) {
                    flowLegend.classList.toggle('hidden', !hub.loaded);
                }
                if (liveBadge) {
                    if (count > 0) {
                        liveBadge.className = 'flex items-center gap-1.5 text-emerald-300 font-medium';
                        liveBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span><span>' + count + ' Live</span>';
                    } else {
                        liveBadge.className = 'flex items-center gap-1.5 text-slate-500 font-medium';
                        liveBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-slate-600"></span><span>No live connections</span>';
                    }
                }

                updateOrbMetrics();

                // Emit real packets for newly arrived live events (capped per poll so bursts stay clean)
                const toEmit = orb.hasSeededLive ? freshEvents.slice(0, 14) : freshEvents.slice(0, 8);
                toEmit.forEach((ev, idx) => {
                    const site = orb.siteNodes.find(s => s.key === ev.key);
                    if (!site) return;
                    setTimeout(() => {
                        if (orb.siteNodes.some(s => s.key === site.key)) {
                            spawnSitePacket(site, 'in', 0, ev.failed);
                        }
                    }, idx * 140);
                });
                orb.hasSeededLive = true;
            }

            /**
             * Spawns a single real directional traffic packet between a live site and the orb.
             * dir: 'in' (Site -> Orb request) | 'out' (Orb -> Site response)
             */
            function spawnSitePacket(site, dir, startT = 0, isFailedOverride = null) {
                const isFailed = isFailedOverride !== null
                    ? Boolean(isFailedOverride)
                    : (dir === 'in' && site.liveFailed > 0);
                const baseSpeed = 0.011 + site.volumeRatio * 0.006;
                orb.sitePackets.push({
                    siteKey: site.key,
                    dir,
                    t: startT,
                    speed: orb.focus === 'traffic' ? baseSpeed * 1.2 : baseSpeed,
                    failed: isFailed,
                    size: isFailed ? 3.5 : (dir === 'in' ? 2.8 : 2.4),
                    hue: isFailed ? 358 : (dir === 'in' ? site.hue : 162)
                });
            }

            /**
             * Computes the quadratic Bezier control point for a dual-lane conduit
             * between a live site node and the orb edge.
             */
            function getConduitGeometry(site, cx, cy, orbR, dir) {
                const dx = site.x - cx;
                const dy = site.y - cy;
                const dist = Math.hypot(dx, dy) || 1;
                const ux = dx / dist;
                const uy = dy / dist;

                // Perpendicular normal to separate IN lane and OUT lane cleanly
                const nx = -uy;
                const ny = ux;

                // Start/end points slightly outside the orb core and site node
                const orbEdgeX = cx + ux * (orbR * 0.92);
                const orbEdgeY = cy + uy * (orbR * 0.92);
                const siteEdgeX = site.x - ux * (site.radius + 4);
                const siteEdgeY = site.y - uy * (site.radius + 4);

                // Curve offset creates two distinct glowing lanes (IN curves one side, OUT curves the other)
                const laneSign = dir === 'in' ? 1 : -1;
                const bend = Math.min(34, dist * 0.19) * laneSign;
                const midX = (orbEdgeX + siteEdgeX) * 0.5 + nx * bend;
                const midY = (orbEdgeY + siteEdgeY) * 0.5 + ny * bend;

                if (dir === 'in') {
                    return { x0: siteEdgeX, y0: siteEdgeY, cx: midX, cy: midY, x1: orbEdgeX, y1: orbEdgeY };
                }
                return { x0: orbEdgeX, y0: orbEdgeY, cx: midX, cy: midY, x1: siteEdgeX, y1: siteEdgeY };
            }

            /**
             * Evaluates a quadratic Bezier curve at parameter t in [0, 1].
             */
            function evalQuadBezier(g, t) {
                const inv = 1 - t;
                return {
                    x: inv * inv * g.x0 + 2 * inv * t * g.cx + t * t * g.x1,
                    y: inv * inv * g.y0 + 2 * inv * t * g.cy + t * t * g.y1
                };
            }

            /**
             * Updates the orb's visual storytelling parameters based on current focus,
             * live red site ratio, and active alerts.
             */
            function syncOrbVisualStory() {
                const hasAlert = hub.brevo.flagged > 0 || hub.traffic.alert;
                const totalSites = orb.siteNodes.length;
                const redSites = orb.siteNodes.filter(s => s.liveFailed > 0).length;
                const redRatio = totalSites > 0 ? redSites / totalSites : 0;

                if (orb.isScanning) {
                    orb.targetHue = 200;
                    orb.targetSpeed = 2.4;
                    orb.targetTurbulence = 0.28;
                    orb.targetScale = 0.96;
                    return;
                }

                if (orb.selectedSite) {
                    const site = orb.siteNodes.find(s => s.key === orb.selectedSite);
                    if (site) {
                        orb.targetHue = site.failed > 0 ? 358 : (site.openAlerts > 0 ? 38 : site.hue);
                        orb.targetSpeed = 1.3;
                        orb.targetTurbulence = site.failed > 0 ? 0.22 : 0.14;
                        orb.targetScale = 1.02;
                        return;
                    }
                }

                // Shift the central orb based on the proportion of failing (red) live site nodes
                if ((orb.focus === 'overview' || orb.focus === 'traffic') && totalSites > 0) {
                    if (redRatio > 0.5) {
                        // Most small orbs are red -> big orb turns red
                        orb.targetHue = 358;
                        orb.targetSpeed = 1.85;
                        orb.targetTurbulence = 0.25;
                        orb.targetScale = 1.04;
                        return;
                    }
                    if (redRatio === 0.5) {
                        // Half of the small orbs are red -> big orb turns yellow
                        orb.targetHue = 48;
                        orb.targetSpeed = 1.4;
                        orb.targetTurbulence = 0.19;
                        orb.targetScale = 1.02;
                        return;
                    }
                }

                if (orb.focus === 'traffic') {
                    orb.targetHue = hub.traffic.alert ? 358 : 192;
                    orb.targetSpeed = hub.traffic.alert ? 2.1 : 1.35;
                    orb.targetTurbulence = hub.traffic.alert ? 0.26 : 0.16;
                    orb.targetScale = 1.02;
                } else if (orb.focus === 'brevo') {
                    orb.targetHue = hub.brevo.flagged > 0 ? 38 : 205;
                    orb.targetSpeed = hub.brevo.flagged > 0 ? 1.6 : 0.9;
                    orb.targetTurbulence = hub.brevo.flagged > 0 ? 0.24 : 0.11;
                    orb.targetScale = hub.brevo.flagged > 0 ? 1.04 : 1.0;
                } else if (orb.focus === 'supabase') {
                    orb.targetHue = 178;
                    orb.targetSpeed = 0.85;
                    orb.targetTurbulence = 0.10;
                    orb.targetScale = 0.98;
                } else {
                    orb.targetHue = 205;
                    orb.targetSpeed = hasAlert ? 1.15 : 0.85;
                    orb.targetTurbulence = hasAlert ? 0.16 : 0.11;
                    orb.targetScale = 1.0;
                }
            }

            /**
             * Switches the active focus view and updates the narrative & detail strip.
             */
            function setFocus(newFocus, customNarrative = null) {
                orb.focus = newFocus;
                if (newFocus !== 'traffic' && newFocus !== 'overview') {
                    orb.selectedSite = null;
                }
                syncOrbVisualStory();

                focusButtons.forEach(btn => {
                    const isSelected = btn.dataset.focus === newFocus;
                    const isBrevoAlert = btn.dataset.focus === 'brevo' && hub.brevo.flagged > 0;
                    const isTrafficAlert = btn.dataset.focus === 'traffic' && hub.traffic.alert;

                    if (isSelected) {
                        if (isBrevoAlert) {
                            btn.className = 'focus-btn p-3 rounded-2xl border transition-all text-left active:scale-95 bg-amber-500/15 border-amber-400/50 text-amber-100 shadow-[0_0_20px_rgba(251,191,36,0.12)]';
                        } else if (isTrafficAlert) {
                            btn.className = 'focus-btn p-3 rounded-2xl border transition-all text-left active:scale-95 bg-red-500/15 border-red-400/50 text-red-100';
                        } else {
                            btn.className = 'focus-btn p-3 rounded-2xl border transition-all text-left active:scale-95 bg-sky-500/15 border-sky-400/45 text-sky-100 shadow-[0_0_20px_rgba(56,189,248,0.14)]';
                        }
                    } else {
                        const alertBorder = isBrevoAlert ? 'border-amber-500/30' : isTrafficAlert ? 'border-red-500/35' : 'border-zinc-800/90';
                        btn.className = `focus-btn p-3 rounded-2xl border transition-all text-left active:scale-95 bg-zinc-950/90 ${alertBorder} text-slate-300 hover:border-zinc-700`;
                    }
                });

                renderStoryAndStrip(customNarrative);
                triggerPulse(0.85);
            }

            // HTML escape helper
            const esc = (x) => String(x == null ? '' : x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
            let token = sessionStorage.getItem('sec_token') || '';

            /**
             * Calls the live Supabase Security Gateway.
             */
            async function api(action, extra) {
                const r = await fetch(GW, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(token ? { Authorization: 'Bearer ' + token } : {})
                    },
                    body: JSON.stringify({ action, ...(extra || {}) })
                });
                const j = await r.json().catch(() => ({}));
                if (r.status === 401 && action !== 'login') {
                    token = '';
                    sessionStorage.removeItem('sec_token');
                    showLogin();
                    throw new Error('auth');
                }
                return { status: r.status, body: j };
            }

            /**
             * Applies live gateway response into hub state and rebuilds live site nodes.
             */
            function applyData(d) {
                if (!d || d.error) {
                    hub.err = (d && d.error) || 'no data';
                    return;
                }
                hub.loaded = true;
                hub.err = '';
                hub.traffic.rpm = d.rpm10 || 0;
                hub.traffic.req24 = d.req24 || 0;
                hub.traffic.failed24 = d.failed24 || 0;
                hub.traffic.denied24 = d.denied24 || 0;
                hub.traffic.alert = (d.alerts || []).some(a =>
                    a.status === 'open' &&
                    a.rule !== 'failed_login' &&
                    (a.severity === 'high' || a.severity === 'critical') &&
                    !/email|sender/.test(a.rule)
                );
                hub.brevo.sent = d.emails24 || 0;
                hub.brevo.recipients = d.recipients24 || 0;
                hub.brevo.flagged = d.email_flags || 0;
                hub.brevo.frozen = Boolean(d.email_frozen);
                hub.supabase.dbMB = d.db_mb || 0;
                hub.supabase.storageGB = hub.supabase.dbMB / 1024;
                hub.ai = Boolean(d.ai_armed);
                hub.by_app = d.by_app || {};

                // Only keep open alerts (reviewed alerts stay cleared)
                hub.alerts = (d.alerts || []).filter(a => a.status === 'open');
                hub.openCount = hub.alerts.length;

                // Keep only events after clearedAt
                hub.recent = (d.recent || []).filter(r => {
                    if (!hub.clearedAt) return true;
                    const tsMs = new Date(r.ts).getTime();
                    return Number.isFinite(tsMs) && tsMs > hub.clearedAt;
                });

                hub.logs = hub.recent.map(r => ({
                    time: new Date(r.ts).toLocaleTimeString([], { hour12: false }),
                    source: String(r.app || 'APP').toUpperCase(),
                    severity: r.ok === false ? 'WARN' : 'INFO',
                    message: esc(r.action || 'request') + ' ' + esc(r.status) +
                        (r.username ? ' user ' + esc(r.username) : '') +
                        (r.subject ? ' "' + esc(r.subject) + '"' : '') +
                        (r.ip ? ' from ' + esc(r.ip) : '')
                }));

                rebuildSiteNodes();
            }

            /**
             * Polls the security gateway for fresh live data.
             */
            async function refresh(label) {
                try {
                    const r = await api('summary');
                    applyData(r.body);
                } catch (e) {
                    return;
                }
                syncOrbVisualStory();
                renderStoryAndStrip();
                renderLogList();
                if (label) showToast(label);
            }

            /**

                        ' requests, ' + traffic.failed24 + ' failed, ' + traffic.denied24 + ' denied."'
                    );
                    detailMetrics.innerHTML =
                        m('LIVE SITES', orb.siteNodes.length) +
                        m('PER MIN', traffic.rpm) +
                        m('FAILED 24H', traffic.failed24, traffic.failed24 ? 'text-red-400 font-semibold' : 'text-emerald-300') +
                        m('DENIED 24H', traffic.denied24, traffic.denied24 ? 'text-red-400' : 'text-emerald-300');

                } else if (orb.focus === 'brevo') {
                    storyHeadline.textContent = customNarrative || (
                        '"' + brevo.sent + ' app emails (' + brevo.recipients + ' recipients) sent through the gateways in 24h. ' +
                        (brevo.flagged ? brevo.flagged + ' flagged.' : 'None flagged.') +
                        (brevo.frozen ? ' App email is FROZEN.' : '') + '"'
                    );
                    detailMetrics.innerHTML =
                        m('SENT 24H', brevo.sent) +
                        m('RECIPIENTS', brevo.recipients) +
                        m('FLAGS', brevo.flagged, brevo.flagged ? 'text-amber-300' : 'text-emerald-300') +
                        m('EMAIL', brevo.frozen ? 'FROZEN' : 'live', brevo.frozen ? 'text-red-400' : 'text-emerald-300');
                    detailActions.innerHTML = btn('ctx-scan', 'Run Sweep');
                } else if (orb.focus === 'supabase') {
                    storyHeadline.textContent = customNarrative || (
                        '"The database is ' + supabase.dbMB + ' MB. The ring shows it against 500 MB."'
                    );
                    detailMetrics.innerHTML =
                        m('DB SIZE', supabase.dbMB + ' MB') +
                        m('AI WATCH', hub.ai ? 'armed' : 'off', hub.ai ? 'text-emerald-300' : 'text-amber-300');

                } else {
                    const liveSummary = orb.siteNodes.length
                        ? orb.siteNodes.map(s => s.label + ' (' + s.liveReq + (s.liveFailed ? ', ' + s.liveFailed + ' failed' : '') + ')').join(', ')
                        : 'no live connections right now';
                    storyHeadline.textContent = customNarrative || (
                        open
                            ? ('"' + open + ' open alert' + (open > 1 ? 's' : '') + '. Latest: ' + esc(topAlert.summary) + '"')
                            : ('"All quiet. Live (10m): ' + liveSummary + '."')
                    );
                    detailMetrics.innerHTML =
                        m('LIVE SITES', orb.siteNodes.length) +
                        m('OPEN ALERTS', open, open ? 'text-amber-300' : 'text-emerald-300') +
                        m('AI', hub.ai ? 'armed' : 'off', hub.ai ? 'text-emerald-300' : 'text-amber-300');
                    detailActions.innerHTML = open ? btn('ctx-clear', 'Clear All') : btn('ctx-scan', 'Security Sweep');
                }

                const bs = document.getElementById('ctx-scan');
                const bc = document.getElementById('ctx-clear');
                if (bs) bs.onclick = runSecuritySweep;
                if (bc) bc.onclick = clearAllFlags;
            }

            /**
             * Renders the expandable activity log drawer.
             */
            function renderLogList() {
                const al = hub.alerts.slice(0, 8).map(a =>
                    '<div class="flex items-start gap-2 text-slate-300">' +
                    '<span class="text-slate-600 shrink-0">' + new Date(a.ts).toLocaleString([], { hour12: false }) + '</span>' +
                    '<span class="' + (a.severity === 'critical' || a.severity === 'high' ? 'text-red-400' : 'text-amber-300') + ' shrink-0 font-semibold">ALERT ' + esc(a.app).toUpperCase() + '</span>' +
                    '<span class="leading-snug">' + esc(a.summary) + '</span></div>'
                ).join('');
                const ev = hub.logs.map(i =>
                    '<div class="flex items-start gap-2 text-slate-300">' +

                    '<span class="' + (i.severity === 'WARN' ? 'text-red-400' : 'text-sky-300') + ' shrink-0 font-semibold">' + i.source + '</span>' +
                    '<span class="leading-snug">' + i.message + '</span></div>'
                ).join('');

                logListEl.innerHTML = (al || ev) ? al + ev : '<div class="text-slate-500">Cleared. Waiting for new live events.</div>';
            }

            /**
             * Runs detection rules on the live log.
             */
            async function runSecuritySweep() {
                if (orb.isScanning) return;
                orb.isScanning = true;
                syncOrbVisualStory();
                triggerPulse(1.3, 198);
                storyHeadline.textContent = '"Running the detection rules on the live log..."';
                try {
                    const r = await api('sweep');
                    applyData(r.body);
                } catch (e) {}
                orb.isScanning = false;
                syncOrbVisualStory();
                renderStoryAndStrip();
                renderLogList();
                triggerPulse(1.1);
                showToast('Sweep complete');
            }

            /**
             * Acknowledges open alerts and wipes all displayed live connections,
             * packets, sparks, and activity logs until new traffic arrives.
             */
            async function clearAllFlags() {
                const openAlerts = hub.alerts.filter(x => x.status === 'open');
                for (const a of openAlerts) {
                    try {
                        await api('ack', { id: a.id });
                    } catch (e) {
                        break;
                    }
                }
                hub.clearedAt = Date.now();
                sessionStorage.setItem('sec_cleared_at', String(hub.clearedAt));
                hub.alerts = [];
                hub.recent = [];
                hub.logs = [];
                hub.openCount = 0;

                // Wipe live orb visuals cleanly
                orb.siteNodes = [];
                orb.sitePackets = [];
                orb.impactSparks = [];
                orb.selectedSite = null;
                orb.hoveredSite = null;

                if (liveBadge) {
                    liveBadge.className = 'flex items-center gap-1.5 text-slate-500 font-medium';
                    liveBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-slate-600"></span><span>No live connections</span>';
                }

                activityDrawer.classList.add('hidden');
                updateOrbMetrics();
                syncOrbVisualStory();
                renderStoryAndStrip('"Cleared. Waiting for new live connections..."');
                renderLogList();
                triggerPulse(0.9, 162);
                showToast('Cleared all results');
            }

            /**
             * Displays the admin login modal when unauthenticated.
             */
            function showLogin() {
                let o = document.getElementById('login-overlay');
                if (!o) {
                    o = document.createElement('div');
                    o.id = 'login-overlay';
                    o.className = 'fixed inset-0 z-[60] bg-black/95 flex items-center justify-center p-4';
                    o.innerHTML = '<form id="login-form" class="w-full max-w-xs p-5 rounded-2xl bg-zinc-950 border border-zinc-800 space-y-3"><div class="text-sm uppercase tracking-widest text-sky-200">CAB Security</div><input id="login-user" name="username" value="admin" autocomplete="username" class="w-full bg-transparent border border-zinc-800 rounded-xl px-3 py-2 text-sm"><input id="login-pw" name="password" type="password" autocomplete="current-password" placeholder="Admin password" class="w-full bg-transparent border border-zinc-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-sky-400/50"><button class="w-full px-4 py-2.5 rounded-xl bg-sky-500/20 border border-sky-400/30 text-sky-200 text-sm">Sign in</button><p id="login-err" class="text-xs text-red-400 min-h-[1rem]"></p></form>';
                    document.body.appendChild(o);
                    document.getElementById('login-form').addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const r = await api('login', { password: document.getElementById('login-pw').value });

                            refresh();
                        } else {
                            document.getElementById('login-err').textContent = 'Wrong password';
                        }
                    });
                }
            }

            /**
             * Initializes 3D Fibonacci sphere lattice and ambient orbit particles.
             */
            function initVisualGeometry() {
                orb.latticeNodes = [];
                const count = 46;
                const golden = (1 + Math.sqrt(5)) / 2;
                for (let i = 0; i < count; i++) {
                    const theta = (2 * Math.PI * i) / golden;
                    const phi = Math.acos(1 - (2 * (i + 0.5)) / count);
                    orb.latticeNodes.push({
                        x: Math.sin(phi) * Math.cos(theta),
                        y: Math.cos(phi),
                        z: Math.sin(phi) * Math.sin(theta)
                    });
                }

                orb.flowParticles = [];
                for (let i = 0; i < 42; i++) {
                    orb.flowParticles.push({
                        angle: Math.random() * Math.PI * 2,
                        dist: 1.06 + Math.random() * 0.55,
                        speed: 0.003 + Math.random() * 0.006,
                        size: 1.1 + Math.random() * 1.6,
                        alpha: 0.2 + Math.random() * 0.45
                    });
                }
            }

            /**
             * Computes the enlarged orb radius and frames live site nodes around it.
             */
            function updateOrbMetrics() {
                if (!orb.width || !orb.height) return;
                const minDim = Math.min(orb.width, orb.height);
                const hasSites = orb.siteNodes.length > 0;

                // Much larger centerpiece orb, slightly adjusted when live site nodes surround it
                orb.baseRadius = hasSites
                    ? Math.min(165, Math.max(96, minDim * 0.30))
                    : Math.min(195, Math.max(115, minDim * 0.38));

                // Position live site nodes cleanly around the outer perimeter
                const padX = Math.min(76, orb.width * 0.14);
                const padY = Math.min(54, orb.height * 0.12);
                const rx = Math.max(orb.baseRadius + 58, (orb.width / 2) - padX);
                const ry = Math.max(orb.baseRadius + 46, (orb.height / 2) - padY);

                orb.siteNodes.forEach(site => {
                    site.x = orb.cx + Math.cos(site.angle) * rx;
                    site.y = orb.cy + Math.sin(site.angle) * ry;
                    site.radius = 12 + site.volumeRatio * 6;
                });
            }

            /**
             * Responsive canvas sizing with crisp DPR.
             */
            function resizeCanvas() {
                const rect = stage.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                orb.width = rect.width;
                orb.height = rect.height;
                canvas.width = Math.floor(rect.width * dpr);
                canvas.height = Math.floor(rect.height * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                orb.cx = orb.width / 2;
                orb.cy = orb.height / 2;
                updateOrbMetrics();
            }

            /**
             * Checks if a pointer position hits a live site node.
             */
            function hitTestSite(x, y) {
                for (let i = 0; i < orb.siteNodes.length; i++) {
                    const s = orb.siteNodes[i];
                    const dist = Math.hypot(x - s.x, y - s.y);
                    if (dist <= s.radius + 16) return s;
                }
                return null;
            }

            /**
             * Draws an organic plasma wave layer inside the central orb.
             */
            function drawPlasmaLayer(cx, cy, radius, phase, idx, hue) {
                const pts = 64;
                ctx.beginPath();
                for (let i = 0; i <= pts; i++) {
                    const a = (i / pts) * Math.PI * 2;
                    const w1 = Math.sin(a * 3 + orb.time * 1.3 + phase) * orb.turbulence;
                    const w2 = Math.cos(a * 5 - orb.time * 1.7 + idx) * (orb.turbulence * 0.5);
                    const r = radius * (1 + w1 + w2);
                    const x = cx + Math.cos(a) * r;
                    const y = cy + Math.sin(a) * r;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();

                const grad = ctx.createRadialGradient(cx - radius * 0.18, cy - radius * 0.18, radius * 0.05, cx, cy, radius * 1.2);
                grad.addColorStop(0, `hsla(${hue - 10}, 100%, ${64 + idx * 10}%, 0.48)`);
                grad.addColorStop(0.6, `hsla(${hue}, 95%, 50%, 0.24)`);
                grad.addColorStop(1, `hsla(${hue + 14}, 90%, 30%, 0)`);
                ctx.fillStyle = grad;
                ctx.fill();
            }

            /**
             * Draws the 3D rotating holographic lattice inside the orb.
             */
            function drawLattice(cx, cy, radius, hue) {
                const rotY = orb.time * 0.42;
                const rotX = Math.sin(orb.time * 0.28) * 0.35 + (orb.pointerActive ? (orb.pointerY - orb.cy) * 0.0014 : 0);
                const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
                const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
                const sphereR = radius * 0.85;
                const proj = [];

                for (let i = 0; i < orb.latticeNodes.length; i++) {
                    const n = orb.latticeNodes[i];
                    const x1 = n.x * cosY - n.z * sinY;
                    const z1 = n.z * cosY + n.x * sinY;
                    const y2 = n.y * cosX - z1 * sinX;
                    const z2 = z1 * cosX + n.y * sinX;
                    proj.push({ x: cx + x1 * sphereR, y: cy + y2 * sphereR, z: z2, depth: (z2 + 1.8) / 2.8 });
                }

                const maxD2 = (sphereR * 0.56) * (sphereR * 0.56);
                ctx.lineWidth = 0.8;
                for (let i = 0; i < proj.length; i++) {
                    if (proj[i].z < -0.2) continue;
                    for (let j = i + 1; j < proj.length; j++) {
                        if (proj[j].z < -0.2) continue;
                        const dx = proj[i].x - proj[j].x;
                        const dy = proj[i].y - proj[j].y;
                        const d2 = dx * dx + dy * dy;
                        if (d2 < maxD2) {
                            const alpha = (1 - d2 / maxD2) * 0.3 * proj[i].depth;
                            ctx.strokeStyle = `hsla(${hue - 10}, 100%, 78%, ${alpha})`;
                            ctx.beginPath();
                            ctx.moveTo(proj[i].x, proj[i].y);
                            ctx.lineTo(proj[j].x, proj[j].y);
                            ctx.stroke();
                        }
                    }
                }
            }

            /**
             * Draws live site nodes, dual-lane IN/OUT conduits, real packets, and arrival sparks.
             */
            function drawSiteTraffic(cx, cy, radius) {
                const now = Date.now();
                // Periodically prune connections older than 10 minutes
                if (now - orb.lastPruneTime > 3000) {
                    orb.lastPruneTime = now;
                    if (orb.siteNodes.some(s => (now - s.lastTs) > LIVE_WINDOW_MS)) {
                        rebuildSiteNodes();
                        syncOrbVisualStory();
                        renderStoryAndStrip();
                    }
                }

                if (orb.siteNodes.length === 0) return;

                // 1. Draw dual-lane conduits for each live site
                orb.siteNodes.forEach(site => {
                    const isSelected = orb.selectedSite === site.key;
                    const isHovered = orb.hoveredSite === site.key;
                    const dimmed = orb.selectedSite && !isSelected;
                    const isFailed = site.liveFailed > 0;
                    const laneAlpha = dimmed ? 0.12 : (isSelected || isHovered ? 0.55 : 0.28);

                    const inGeo = getConduitGeometry(site, cx, cy, radius, 'in');
                    const outGeo = getConduitGeometry(site, cx, cy, radius, 'out');

                    // Incoming lane (Site -> Orb): solid line, red if failing
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(inGeo.x0, inGeo.y0);
                    ctx.quadraticCurveTo(inGeo.cx, inGeo.cy, inGeo.x1, inGeo.y1);
                    ctx.strokeStyle = isFailed
                        ? `hsla(358, 92%, 58%, ${laneAlpha + 0.12})`
                        : `hsla(${site.hue}, 90%, 64%, ${laneAlpha})`;
                    ctx.lineWidth = isSelected || isHovered ? 2 : 1.25;
                    ctx.stroke();

                    // Outgoing lane (Orb -> Site): dashed response lane
                    ctx.beginPath();
                    ctx.setLineDash([4, 5]);
                    ctx.moveTo(outGeo.x0, outGeo.y0);
                    ctx.quadraticCurveTo(outGeo.cx, outGeo.cy, outGeo.x1, outGeo.y1);
                    ctx.strokeStyle = `hsla(162, 85%, 56%, ${laneAlpha * 0.9})`;
                    ctx.lineWidth = isSelected || isHovered ? 1.8 : 1.1;
                    ctx.stroke();
                    ctx.restore();
                });

                // 2. Update & draw real IN and OUT packets
                for (let i = orb.sitePackets.length - 1; i >= 0; i--) {
                    const pkt = orb.sitePackets[i];
                    const site = orb.siteNodes.find(s => s.key === pkt.siteKey);
                    if (!site) {
                        orb.sitePackets.splice(i, 1);
                        continue;
                    }

                    pkt.t += pkt.speed;
                    const geo = getConduitGeometry(site, cx, cy, radius, pkt.dir);
                    const pos = evalQuadBezier(geo, Math.min(1, pkt.t));
                    const tailPos = evalQuadBezier(geo, Math.max(0, pkt.t - 0.12));

                    const dimmed = orb.selectedSite && orb.selectedSite !== site.key;
                    const alpha = dimmed ? 0.18 : 0.95;

                    // Glowing trail
                    ctx.save();
                    const grad = ctx.createLinearGradient(tailPos.x, tailPos.y, pos.x, pos.y);
                    grad.addColorStop(0, `hsla(${pkt.hue}, 100%, 65%, 0)`);
                    grad.addColorStop(1, `hsla(${pkt.hue}, 100%, 70%, ${alpha})`);
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = pkt.size * 1.15;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(tailPos.x, tailPos.y);
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();

                    // Bright packet head
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, pkt.size, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${pkt.hue}, 100%, 84%, ${alpha})`;
                    ctx.fill();
                    ctx.restore();

                    if (pkt.t >= 1) {
                        spawnSpark(pos.x, pos.y, pkt.hue, pkt.failed);
                        if (pkt.dir === 'in') {
                            // Incoming request hit the orb -> emit matching OUT response packet
                            spawnSitePacket(site, 'out', 0, false);
                        } else {
                            site.pulse = 1.0;
                        }
                        orb.sitePackets.splice(i, 1);
                    }
                }

                // 3. Draw impact sparks
                for (let i = orb.impactSparks.length - 1; i >= 0; i--) {
                    const sp = orb.impactSparks[i];
                    sp.radius += 0.9;
                    sp.alpha *= 0.86;
                    ctx.beginPath();
                    ctx.arc(sp.x, sp.y, sp.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = `hsla(${sp.hue}, 100%, 72%, ${sp.alpha})`;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    if (sp.alpha < 0.04 || sp.radius > sp.maxRadius) {
                        orb.impactSparks.splice(i, 1);
                    }
                }

                // 4. Draw live site orbs & labels
                orb.siteNodes.forEach(site => {
                    const isSelected = orb.selectedSite === site.key;
                    const isHovered = orb.hoveredSite === site.key;
                    const dimmed = orb.selectedSite && !isSelected;
                    const isFailed = site.liveFailed > 0;
                    const nodeHue = isFailed ? 358 : site.hue;
                    const alpha = dimmed ? 0.3 : 1.0;

                    site.pulse = Math.max(0, site.pulse * 0.94);

                    // Outer glow halo
                    const haloR = site.radius * (2.1 + site.pulse * 0.5);
                    const halo = ctx.createRadialGradient(site.x, site.y, site.radius * 0.2, site.x, site.y, haloR);
                    halo.addColorStop(0, `hsla(${nodeHue}, 100%, 58%, ${0.42 * alpha})`);
                    halo.addColorStop(1, `hsla(${nodeHue}, 100%, 40%, 0)`);
                    ctx.fillStyle = halo;
                    ctx.beginPath();
                    ctx.arc(site.x, site.y, haloR, 0, Math.PI * 2);
                    ctx.fill();

                    // Small site orb body
                    ctx.beginPath();
                    ctx.arc(site.x, site.y, site.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${nodeHue}, 50%, 10%, ${0.92 * alpha})`;
                    ctx.fill();
                    ctx.lineWidth = isSelected || isHovered ? 2.2 : 1.5;
                    ctx.strokeStyle = `hsla(${nodeHue}, 95%, ${isFailed ? 60 : 68}%, ${alpha})`;
                    ctx.stroke();

                    // Inner bright core dot
                    ctx.beginPath();
                    ctx.arc(site.x, site.y, site.radius * 0.34, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${nodeHue}, 100%, ${isFailed ? 64 : 78}%, ${alpha})`;
                    ctx.fill();

                    // Site name & live counter label
                    ctx.save();
                    ctx.font = '500 11px Inter, sans-serif';
                    ctx.textAlign = 'center';
                    const labelY = site.y > cy ? site.y + site.radius + 15 : site.y - site.radius - 18;
                    ctx.fillStyle = isFailed
                        ? `rgba(254, 202, 202, ${alpha})`
                        : `rgba(226, 232, 240, ${alpha})`;
                    ctx.fillText(site.label, site.x, labelY);

                    ctx.font = '400 10px ui-monospace, SFMono-Regular, Menlo, monospace';
                    ctx.fillStyle = isFailed
                        ? `rgba(248, 113, 113, ${alpha})`
                        : `rgba(148, 163, 184, ${alpha})`;
                    const sub = site.liveFailed > 0
                        ? `${site.liveReq} req • ${site.liveFailed} fail`
                        : `${site.liveReq} live`;
                    ctx.fillText(sub, site.x, labelY + 12);
                    ctx.restore();
                });
            }

            /**
             * Draws visual storytelling overlays directly around the orb.
             */
            function drawStoryVisuals(cx, cy, radius, hue) {
                // 1. Scanning radar sweep
                if (orb.isScanning) {
                    orb.scanAngle += 0.08;
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(orb.scanAngle);
                    ctx.beginPath();
                    ctx.arc(0, 0, radius * 1.18, 0, 1.1);
                    ctx.strokeStyle = 'hsla(195, 100%, 76%, 0.75)';
                    ctx.lineWidth = 2.5;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                    ctx.restore();
                }

                // 2. Supabase Quota Arc (when focused on Supabase)
                if (orb.focus === 'supabase') {
                    const pct = Math.min(1, hub.supabase.storageGB / hub.supabase.quotaGB);
                    const ringR = radius * 1.16;
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.14)';
                    ctx.lineWidth = 4;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(cx, cy, ringR, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct);
                    ctx.strokeStyle = 'hsla(176, 95%, 64%, 0.9)';
                    ctx.lineWidth = 4;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                    ctx.restore();
                }

                // 3. Brevo Warning Arcs (when Brevo has active flags)
                if (hub.brevo.flagged > 0 && (orb.focus === 'brevo' || orb.focus === 'overview')) {
                    const arcCount = orb.focus === 'brevo' ? 4 : 2;
                    for (let a = 0; a < arcCount; a++) {
                        const seed = Math.floor(orb.time * 10) + a * 23;
                        const startA = ((seed * 1.618) % 1) * Math.PI * 2;
                        ctx.beginPath();
                        for (let s = 0; s <= 8; s++) {
                            const frac = s / 8;
                            const ang = startA + frac * 0.7;
                            const env = Math.sin(frac * Math.PI);
                            const jitter = Math.sin(orb.time * 16 + s * 2.5 + a) * radius * 0.1 * env;
                            const r = radius * (0.86 + env * 0.18) + jitter;
                            const x = cx + Math.cos(ang) * r;
                            const y = cy + Math.sin(ang) * r;
                            if (s === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.strokeStyle = `hsla(38, 100%, 68%, ${orb.focus === 'brevo' ? 0.72 : 0.38})`;
                        ctx.lineWidth = orb.focus === 'brevo' ? 1.8 : 1.2;
                        ctx.stroke();
                    }
                }

                // 4. Calm ambient orbit particles
                orb.flowParticles.forEach(pt => {
                    pt.angle += pt.speed * orb.speed;
                    const px = cx + Math.cos(pt.angle) * (radius * pt.dist);
                    const py = cy + Math.sin(pt.angle) * (radius * pt.dist);
                    ctx.fillStyle = `hsla(${hue - 8}, 100%, 78%, ${pt.alpha})`;
                    ctx.beginPath();
                    ctx.arc(px, py, pt.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                // 5. Hold-to-Scan progress ring
                if (orb.holdLevel > 0.03) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius * 1.22, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * orb.holdLevel);
                    ctx.strokeStyle = 'hsla(198, 100%, 82%, 0.85)';
                    ctx.lineWidth = 2.5;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
            }

            /**
             * Main animation loop.
             */
            function render() {
                orb.frame++;

                // Hold progression
                if (orb.isHolding) orb.holdLevel = Math.min(1, orb.holdLevel + 0.022);
                else orb.holdLevel = Math.max(0, orb.holdLevel - 0.06);

                // Smooth hue & energy interpolation
                let hueDiff = orb.targetHue - orb.hue;
                if (hueDiff > 180) hueDiff -= 360;
                if (hueDiff < -180) hueDiff += 360;
                orb.hue = (orb.hue + hueDiff * 0.05 + 360) % 360;

                orb.speed += (orb.targetSpeed + orb.holdLevel * 1.6 - orb.speed) * 0.06;
                orb.turbulence += (orb.targetTurbulence + orb.holdLevel * 0.14 - orb.turbulence) * 0.06;
                orb.scale += (orb.targetScale + orb.holdLevel * 0.06 - orb.scale) * 0.06;
                orb.time += 0.02 * orb.speed;

                ctx.clearRect(0, 0, orb.width, orb.height);

                const offsetX = orb.pointerActive ? (orb.pointerX - orb.cx) * 0.035 : 0;
                const offsetY = orb.pointerActive ? (orb.pointerY - orb.cy) * 0.035 : 0;
                const cx = orb.cx + offsetX;
                const cy = orb.cy + offsetY;
                const breathe = Math.sin(orb.time * 1.5) * 0.025;
                const radius = orb.baseRadius * (orb.scale + breathe);
                const hue = orb.hue;

                // Outer ambient glow
                const aura = ctx.createRadialGradient(cx, cy, radius * 0.2, cx, cy, radius * 1.75);
                aura.addColorStop(0, `hsla(${hue}, 100%, 58%, 0.34)`);
                aura.addColorStop(0.55, `hsla(${hue + 10}, 95%, 42%, 0.12)`);
                aura.addColorStop(1, 'hsla(210, 90%, 20%, 0)');
                ctx.fillStyle = aura;
                ctx.beginPath();
                ctx.arc(cx, cy, radius * 1.75, 0, Math.PI * 2);
                ctx.fill();

                // Expanding shockwave pulses
                for (let i = orb.pulses.length - 1; i >= 0; i--) {
                    const p = orb.pulses[i];
                    p.radius += 3.6;
                    p.alpha *= 0.93;
                    ctx.beginPath();
                    ctx.arc(cx, cy, p.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = `hsla(${p.hue ?? hue - 8}, 100%, 76%, ${p.alpha})`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    if (p.alpha < 0.02 || p.radius > p.maxRadius) orb.pulses.splice(i, 1);
                }

                // Storytelling visuals & live per-site traffic conduits
                drawStoryVisuals(cx, cy, radius, hue);
                drawSiteTraffic(cx, cy, radius);

                // Plasma Core & 3D Lattice
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                drawPlasmaLayer(cx, cy, radius * 1.02, 0.0, 0, hue + 8);
                drawPlasmaLayer(cx, cy, radius * 0.90, 2.2, 1, hue);
                drawPlasmaLayer(cx, cy, radius * 0.76, 4.1, 2, hue - 10);
                drawLattice(cx, cy, radius, hue);

                // Bright luminous center core
                const core = ctx.createRadialGradient(cx - radius * 0.12, cy - radius * 0.14, radius * 0.03, cx, cy, radius * 0.72);
                core.addColorStop(0, `hsla(${hue - 14}, 100%, 96%, 0.92)`);
                core.addColorStop(0.35, `hsla(${hue - 4}, 100%, 66%, 0.62)`);
                core.addColorStop(1, `hsla(${hue + 10}, 100%, 40%, 0)`);
                ctx.fillStyle = core;
                ctx.beginPath();
                ctx.arc(cx, cy, radius * 0.72, 0, Math.PI * 2);
                ctx.fill();

                // Clean glass rim highlight
                ctx.beginPath();
                ctx.arc(cx, cy, radius * 0.95, Math.PI * 1.1, Math.PI * 1.62);
                ctx.strokeStyle = `hsla(${hue - 16}, 100%, 92%, 0.4)`;
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.restore();

                requestAnimationFrame(render);
            }

            /**
             * Event Listeners
             */
            function bindEvents() {
                window.addEventListener('resize', resizeCanvas);

                stage.addEventListener('pointermove', (e) => {
                    const rect = stage.getBoundingClientRect();
                    orb.pointerX = e.clientX - rect.left;
                    orb.pointerY = e.clientY - rect.top;
                    orb.pointerActive = true;
                    const hit = hitTestSite(orb.pointerX, orb.pointerY);
                    orb.hoveredSite = hit ? hit.key : null;
                });

                stage.addEventListener('pointerdown', (e) => {
                    const rect = stage.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const hit = hitTestSite(x, y);
                    if (hit) {
                        orb.selectedSite = orb.selectedSite === hit.key ? null : hit.key;
                        syncOrbVisualStory();
                        renderStoryAndStrip();
                        triggerPulse(0.85, hit.liveFailed > 0 ? 358 : hit.hue);
                        return;
                    }
                    orb.isHolding = true;
                    if (orbHint) orbHint.classList.add('opacity-0');
                });

                const endHold = () => {
                    if (!orb.isHolding) return;
                    orb.isHolding = false;
                    runSecuritySweep();
                };

                stage.addEventListener('pointerup', endHold);
                stage.addEventListener('pointercancel', endHold);
                stage.addEventListener('pointerleave', () => {
                    orb.pointerActive = false;
                    orb.hoveredSite = null;
                    if (orb.isHolding) endHold();
                });

                focusButtons.forEach(btn => {
                    btn.addEventListener('click', () => setFocus(btn.dataset.focus));
                });

                logToggleBtn.addEventListener('click', () => {
                    activityDrawer.classList.toggle('hidden');
                });

                clearFlagsBtn.addEventListener('click', clearAllFlags);
                clearAllBtn.addEventListener('click', clearAllFlags);

                soundBtn.addEventListener('click', () => {
                    orb.soundEnabled = !orb.soundEnabled;
                    iconSoundOff.classList.toggle('hidden', orb.soundEnabled);
                    iconSoundOn.classList.toggle('hidden', !orb.soundEnabled);
                    if (orb.soundEnabled) {
                        playTone(520, 0.2);
                        showToast('Audio Enabled');
                    } else {
                        showToast('Audio Muted');
                    }
                });
            }

            window.onload = function () {
                resizeCanvas();
                initVisualGeometry();
                syncOrbVisualStory();
                renderStoryAndStrip();
                renderLogList();
                bindEvents();
                render();
                if (token) refresh(); else showLogin();
                // Poll every 10 seconds while tab is active for live connections
                setInterval(() => { if (token && !document.hidden) refresh(); }, 10000);
            };
        })();
    </script>
</body>
</html>
