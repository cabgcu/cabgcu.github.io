<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CAB Portal</title>
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        zinc: {
                            900: '#18181b',
                            950: '#09090b',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #71717a; }

        /* Security Input */
        .no-save-pass { -webkit-text-security: disc !important; text-security: disc !important; }

        /* Dark Theme Cards */
        .glass-card {
            background: rgba(9, 9, 11, 0.65);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        
        .glass-button {
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .glass-button:hover {
            background: rgba(24, 24, 27, 0.5);
            border: 1px solid rgba(168, 85, 247, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.25);
        }

        /* View Switching Logic */
        .view { display: none; opacity: 0; transform: translateY(15px); transition: 0.4s ease; }
        .view.active { display: flex; opacity: 1; transform: translateY(0); }

        /* Overlays & Loaders */
        #loading-overlay {
            position: fixed; inset: 0; z-index: 9999; background: #09090b;
            display: flex; align-items: center; justify-content: center; pointer-events: none;
        }
        .loading-logo { width: 90px; height: 90px; animation: smooth-spin 1.2s linear infinite; opacity: 0.8; }
        .loader { display: none; width: 16px; height: 16px; border: 2px solid #fff; border-bottom-color: transparent; border-radius: 50%; animation: smooth-spin 1s linear infinite; }
        
        @keyframes smooth-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Dynamic Backgrounds (Now contained in the Left Card) */
        #bg-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; background: #151518; }
        .bg-slide { position: absolute; inset: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 2s ease-in-out; }
        .bg-slide.active { opacity: 0.9; }

        /* Admin Input styling */
        .control-input {
            width: 100%; 
            background: #18181b; 
            border: 1px solid #27272a; 
            color: #ffffff; 
            border-radius: 0.75rem; 
            padding: 0.8rem 1rem; 
            margin-bottom: 0.75rem; 
            outline: none; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .control-input::placeholder { color: rgba(255, 255, 255, 0.3); }
        .control-input:focus { 
            border-color: #a855f7; 
            background: #27272a; 
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.15); 
            transform: translateY(-2px);
        }
        .control-input:hover:not(:focus) {
            border-color: rgba(168, 85, 247, 0.4);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="text-zinc-100 min-h-[100dvh] relative overflow-x-hidden selection:bg-purple-500/30 font-sans bg-black flex items-center justify-center p-4 sm:p-8 antialiased">

    <!-- Loading Overlay -->
    <div id="loading-overlay"><img src="https://i.imgur.com/p2qZOL5.png" alt="Logo" class="loading-logo"></div>

    <!-- Page Background Image -->
    <div class="fixed inset-0 bg-[url('https://i.imgur.com/4DfFmUh.png')] bg-cover bg-center bg-no-repeat bg-fixed z-[-3]"></div>
    
    <!-- Dark Blur Overlay for Readability -->
    <div id="bg-overlay" class="fixed inset-0 bg-zinc-950/60 backdrop-blur-sm z-[-2]"></div>

    <!-- Main Layout Wrapper -->
    <div class="relative w-full max-w-5xl z-10 flex flex-col md:flex-row gap-5 h-[85vh] md:h-[78vh]">
        
        <!-- Left Side: Image Card (Contains Supabase Backgrounds) -->
        <div class="hidden md:block md:w-1/2 h-full glass-card rounded-2xl overflow-hidden relative shadow-2xl transition-transform duration-500 hover:shadow-[0_0_40px_rgba(168,85,247,0.1)]">
            <div id="bg-container">
                <!-- Fallback before DB loads -->
                <div class="bg-slide active" style="background-image: url('https://i.imgur.com/y4wt546.jpeg')"></div>
            </div>
        </div>

        <!-- Right Side: Portal & Admin Container -->
        <div class="w-full md:w-1/2 flex flex-col relative h-full glass-card rounded-2xl overflow-hidden shadow-2xl transition-transform duration-500 hover:shadow-[0_0_40px_rgba(168,85,247,0.1)]">

            <!-- Header / Settings Button -->
            <div class="absolute top-6 right-6 z-20">
                <button type="button" onclick="checkAuthAndShowAdmin()" class="w-8 h-8 flex items-center justify-center rounded-lg border border-white/10 text-zinc-400 hover:text-white hover:bg-white/10 transition-all duration-300 focus:outline-none hover:scale-105" title="Admin Access">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Scrollable Content Area -->
            <div class="flex-1 overflow-y-auto p-6 sm:p-10 flex flex-col w-full">
                
                <!-- PORTAL VIEW -->
                <div id="portalView" class="view active flex-col items-center text-center my-auto w-full max-w-[340px] mx-auto">
                    
                    <!-- Profile Header / Logo -->
                    <div class="relative mb-6 flex justify-center w-full transition-transform duration-500 hover:scale-105" id="avatarFrame">
                        <img id="profileImg" src="https://i.imgur.com/p2qZOL5.png" alt="Profile Picture" class="h-16 sm:h-20 object-contain drop-shadow-[0_0_15px_rgba(255,255,255,0.1)]">
                    </div>

                    <h1 id="portalName" class="text-[32px] sm:text-[36px] font-extrabold mb-2 text-white tracking-tight leading-tight">
                        CAB GCU
                    </h1>
                    
                    <p id="portalBio" class="text-zinc-400 mb-6 font-medium text-sm px-2 whitespace-pre-wrap leading-relaxed"></p>

                    <a href="#" id="portalHandle" class="inline-block px-5 py-1.5 mb-8 rounded-full bg-purple-500/10 border border-purple-500/30 text-[11px] font-bold text-purple-400 hover:text-white hover:bg-purple-500/30 hover:border-purple-500/50 transition-all duration-300 tracking-[0.1em] uppercase hover:shadow-[0_0_15px_rgba(168,85,247,0.4)]" style="display: none;"></a>

                    <!-- Links Container -->
                    <div id="linksContainer" class="w-full flex flex-col gap-3"></div>
                    
                    <!-- Footer -->
                    <footer class="mt-10 text-zinc-500 text-[10px] tracking-wide w-full flex justify-center items-center">
                        <p class="whitespace-nowrap">© <span id="year"></span> Canyon Activities Board</p>
                    </footer>
                </div>

                <!-- ADMIN VIEW -->
                <div id="adminView" class="view flex-col w-full max-w-[400px] mx-auto my-auto py-8">
                    <div class="flex justify-between items-center mb-8">
                        <h2 class="text-2xl font-bold tracking-tight text-white">Portal Settings</h2>
                        <div class="flex gap-2">
                            <button class="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-300 px-3 py-1.5 rounded-lg text-sm flex items-center gap-1 transition-all duration-300 hover:-translate-y-1 hover:shadow-lg font-medium" onclick="adminLogout()">
                                <i data-lucide="lock" class="w-3.5 h-3.5"></i> Lock
                            </button>
                            <button class="bg-gradient-to-r from-blue-600 to-purple-600 border border-purple-500/50 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:opacity-90 transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_0_15px_rgba(168,85,247,0.4)] shadow-sm" onclick="switchView('portal')">
                                Close
                            </button>
                        </div>
                    </div>

                    <!-- Analytics Dashboard -->
                    <div class="grid grid-cols-2 gap-4 mb-8">
                        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex flex-col items-center justify-center transition-all duration-300 hover:-translate-y-1 hover:border-purple-500/30 hover:shadow-lg cursor-default">
                            <i data-lucide="eye" class="w-6 h-6 text-purple-400 mb-2"></i>
                            <span class="text-2xl font-bold text-white" id="adminTotalViews">0</span>
                            <span class="text-[10px] sm:text-xs text-zinc-500 uppercase tracking-widest mt-1 text-center">Page Views</span>
                        </div>
                        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex flex-col items-center justify-center transition-all duration-300 hover:-translate-y-1 hover:border-blue-500/30 hover:shadow-lg cursor-default">
                            <i data-lucide="mouse-pointer-click" class="w-6 h-6 text-blue-400 mb-2"></i>
                            <span class="text-2xl font-bold text-white" id="adminTotalClicks">0</span>
                            <span class="text-[10px] sm:text-xs text-zinc-500 uppercase tracking-widest mt-1 text-center">Total Clicks</span>
                        </div>
                    </div>
                    
                    <!-- Branding -->
                    <div class="mb-8 border-b border-zinc-800 pb-8">
                        <label class="block mb-4 text-purple-400 text-xs font-bold uppercase tracking-wider">Branding & Profile</label>
                        <input type="text" id="setProfileName" class="control-input" placeholder="Display Name">
                        <input type="text" id="setSocialHandle" class="control-input" placeholder="Instagram Handle (e.g. @cabgcu)">
                        <textarea id="setProfileBio" class="control-input resize-y min-h-[80px]" placeholder="Bio..."></textarea>
                        <input type="text" id="setAvatarUrl" class="control-input !mb-0" placeholder="Avatar Logo URL">
                    </div>
                    
                    <!-- Backgrounds -->
                    <div class="mb-8 border-b border-zinc-800 pb-8">
                        <label class="block mb-4 text-purple-400 text-xs font-bold uppercase tracking-wider">Manage Backgrounds</label>
                        <div id="bg-list-manager" class="flex flex-col gap-2 mb-4 max-h-[200px] overflow-y-auto pr-1"></div>
                        
                        <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 border-dashed transition-all duration-300 hover:border-zinc-600">
                            <input type="file" id="bgUploadInput" accept="image/*" class="w-full text-sm text-zinc-400 mb-3 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-zinc-800 file:text-white hover:file:bg-zinc-700 transition-all cursor-pointer">
                            <button class="w-full bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white py-2.5 rounded-xl text-sm font-medium flex justify-center items-center gap-2 transition-all duration-300 hover:-translate-y-1 hover:shadow-lg" onclick="uploadBackground()" id="uploadBgBtn">
                                <i data-lucide="upload-cloud" class="w-4 h-4 text-purple-400"></i> Upload to Supabase 
                                <div class="loader" id="uploadBgLoader"></div>
                            </button>
                        </div>
                    </div>

                    <!-- Links -->
                    <div class="mb-8 border-b border-zinc-800 pb-8">
                        <label class="block mb-4 text-purple-400 text-xs font-bold uppercase tracking-wider">Manage Links</label>
                        <div id="link-list-manager" class="flex flex-col gap-2 mb-4 max-h-[250px] overflow-y-auto pr-1"></div>
                        
                        <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 border-dashed flex flex-col gap-3 transition-all duration-300 hover:border-zinc-600">
                            <div class="flex gap-2">
                                <input type="text" id="newLinkIcon" class="control-input !mb-0 w-16 text-center text-lg" placeholder="🔗">
                                <input type="text" id="newLinkTitle" class="control-input !mb-0 flex-1" placeholder="Link Title">
                            </div>
                            <input type="text" id="newLinkUrl" class="control-input !mb-0" placeholder="https://...">
                            <button class="w-full bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white py-2.5 rounded-xl text-sm font-medium flex justify-center items-center gap-2 transition-all duration-300 hover:-translate-y-1 hover:shadow-lg" onclick="addLinkUI()">
                                <i data-lucide="plus" class="w-4 h-4 text-purple-400"></i> Add New Link
                            </button>
                        </div>
                    </div>

                    <!-- Security -->
                    <div class="mb-8">
                        <label class="block mb-4 text-purple-400 text-xs font-bold uppercase tracking-wider">Security</label>
                        <input type="password" id="setAdminPassword" class="control-input !mb-0" placeholder="New Password (leave blank to keep)">
                    </div>
                    
                    <button class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-4 rounded-xl flex justify-center items-center gap-2 transition-all duration-300 hover:-translate-y-1 hover:scale-[1.02] shadow-[0_0_15px_rgba(168,85,247,0.3)] hover:shadow-[0_0_25px_rgba(168,85,247,0.6)] border border-purple-500/50" id="saveBtn" onclick="saveAdminSettings()">
                        Save All Changes <div class="loader" id="saveLoader"></div>
                    </button>
                </div>
            </div>
        </div> <!-- End Right Side Form Card -->
    </div> <!-- End Main Layout Wrapper -->

    <!-- Admin Login Modal -->
    <div id="gateModal" class="fixed inset-0 z-[1000]" style="display: none;">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-zinc-950/80 backdrop-blur-md" onclick="hideGate()"></div>
        <!-- Modal Content -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[90%] max-w-sm glass-card rounded-3xl p-8 flex flex-col items-center text-center shadow-2xl border-purple-500/30">
            <div class="w-20 h-20 bg-zinc-900 rounded-2xl p-3 mb-6 flex items-center justify-center border border-zinc-800">
                <img id="adminGateImg" src="https://i.imgur.com/p2qZOL5.png" alt="CAB" class="w-full h-full object-contain rounded-xl">
            </div>
            <h3 class="text-2xl font-bold mb-1 text-white">Admin Access</h3>
            <p class="text-zinc-400 text-sm mb-8">Enter your credentials to continue</p>
            
            <input type="email" id="adminEmail" class="control-input text-center" placeholder="Admin Email">
            <input type="password" id="adminPass" class="control-input text-center mb-6" placeholder="Password" onkeyup="if(event.key==='Enter') verifyAdmin()">
            
            <button class="w-full bg-gradient-to-r from-blue-600 to-purple-600 border border-purple-500/50 text-white font-bold py-3.5 rounded-xl flex justify-center items-center gap-2 transition-all duration-300 hover:-translate-y-1 hover:scale-[1.02] shadow-[0_0_15px_rgba(168,85,247,0.3)] hover:shadow-[0_0_25px_rgba(168,85,247,0.6)]" id="gateBtn" onclick="verifyAdmin()">
                Authorize <div class="loader" id="gateLoader"></div>
            </button>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const SUPABASE_URL = "https://nmmshjdknmuzpgpquwec.supabase.co";
        const SUPABASE_KEY = "sb_publishable_PCxlxywY7W6K3TmMrSnSsw_NPXKugoZ";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let state = {
            config: { portalName: "CAB GCU", portalBio: "", socialHandle: "@cabgcu", avatarUrl: "", links: [], pageViews: 0 },
            bgImages: [],
            bgIndex: 0,
            bgRotationInterval: null
        };

        // --- SECURITY HELPER ---
        function escapeHTML(str) {
            if (!str) return '';
            return str.toString().replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        document.getElementById('year').textContent = new Date().getFullYear();
        syncData();

        async function syncData() {
            try {
                const [configRes, bgRes] = await Promise.all([
                    _supabase.from('portal_config').select('*'),
                    _supabase.from('background_images').select('*')
                ]);

                if (configRes.data) {
                    configRes.data.forEach(row => {
                        if (row.key === "PortalName") state.config.portalName = row.value;
                        if (row.key === "PortalBio") state.config.portalBio = row.value;
                        if (row.key === "SocialHandle") state.config.socialHandle = row.value;
                        if (row.key === "AvatarUrl") state.config.avatarUrl = row.value;
                        if (row.key === "PageViews") state.config.pageViews = parseInt(row.value) || 0;
                        if (row.key === "LinksJson") state.config.links = JSON.parse(row.value || "[]");
                    });
                }

                if (bgRes.data) {
                    state.bgImages = bgRes.data;
                }

                renderPortal();
                initBackgroundRotation();

                // Track page view once per session load
                if (!sessionStorage.getItem('viewTracked')) {
                    trackPageView();
                    sessionStorage.setItem('viewTracked', 'true');
                }

            } catch (e) {
                console.error("Sync error:", e);
            } finally { 
                document.getElementById('loading-overlay').style.display = 'none'; 
            }
        }

        function renderPortal() {
            document.getElementById('portalName').textContent = state.config.portalName;
            document.getElementById('portalBio').textContent = state.config.portalBio;
            
            const handleEl = document.getElementById('portalHandle');
            if (state.config.socialHandle) {
                handleEl.style.display = 'inline-block';
                handleEl.textContent = state.config.socialHandle;
                const cleanHandle = state.config.socialHandle.replace('@', '').trim();
                handleEl.href = `https://instagram.com/${cleanHandle}`;
                handleEl.target = "_blank";
            } else {
                handleEl.style.display = 'none';
            }
            
            const avatarFrame = document.getElementById('avatarFrame');
            const adminGateImg = document.getElementById('adminGateImg');
            const profileImg = document.getElementById('profileImg');
            
            if (state.config.avatarUrl) {
                profileImg.src = state.config.avatarUrl;
                adminGateImg.src = state.config.avatarUrl;
                avatarFrame.style.display = 'flex';
            } else { 
                profileImg.src = "https://i.imgur.com/p2qZOL5.png";
                adminGateImg.src = "https://i.imgur.com/p2qZOL5.png";
                avatarFrame.style.display = 'flex';
            }

            // Generate glass buttons for links
            document.getElementById('linksContainer').innerHTML = state.config.links.map((link, i) => `
                <a href="${escapeHTML(link.url)}" target="_blank" onclick="trackLinkClick(${i})" class="glass-button w-full py-3.5 sm:py-4 px-6 rounded-xl relative flex items-center justify-center group overflow-hidden shadow-sm">
                    <span class="absolute left-6 text-xl flex-shrink-0 transition-transform duration-300 group-hover:scale-110">${escapeHTML(link.icon) || '🔗'}</span>
                    <span class="font-bold text-[13px] tracking-[0.05em] text-zinc-200 group-hover:text-white transition-colors text-center px-10 w-full block whitespace-nowrap uppercase">${escapeHTML(link.title)}</span>
                    <i data-lucide="chevron-right" class="absolute right-6 w-5 h-5 text-zinc-500 group-hover:text-purple-400 transition-colors flex-shrink-0 group-hover:translate-x-1 duration-300"></i>
                </a>
            `).join('');
            
            // Re-initialize Lucide Icons after dynamic DOM injection
            lucide.createIcons();
        }

        async function trackPageView() {
            try {
                const { data } = await _supabase.from('portal_config').select('value').eq('key', 'PageViews').maybeSingle();
                let currentViews = data ? (parseInt(data.value) || 0) : 0;
                
                if (data) {
                    await _supabase.from('portal_config').update({ value: (currentViews + 1).toString() }).eq('key', 'PageViews');
                } else {
                    await _supabase.from('portal_config').insert([{ key: 'PageViews', value: '1' }]);
                }
            } catch (e) { console.warn('Tracking blocked by permissions', e); }
        }

        async function trackLinkClick(idx) {
            try {
                // Fetch fresh values to prevent overriding links if someone else edited them
                const { data } = await _supabase.from('portal_config').select('value').eq('key', 'LinksJson').single();
                if (data) {
                    let freshLinks = JSON.parse(data.value || "[]");
                    if (freshLinks[idx]) {
                        freshLinks[idx].clicks = (freshLinks[idx].clicks || 0) + 1;
                        await _supabase.from('portal_config').update({ value: JSON.stringify(freshLinks) }).eq('key', 'LinksJson');
                    }
                }
            } catch (e) { console.warn('Click tracking blocked', e); }
        }

        function loadAdminValues() {
            document.getElementById('setProfileName').value = state.config.portalName;
            document.getElementById('setProfileBio').value = state.config.portalBio;
            document.getElementById('setSocialHandle').value = state.config.socialHandle;
            document.getElementById('setAvatarUrl').value = state.config.avatarUrl;
            document.getElementById('setAdminPassword').value = '';
            
            // Populate Analytics
            const totalClicks = state.config.links.reduce((sum, link) => sum + (link.clicks || 0), 0);
            document.getElementById('adminTotalViews').textContent = state.config.pageViews;
            document.getElementById('adminTotalClicks').textContent = totalClicks;

            renderAdminLinks();
            renderAdminBackgrounds();
        }

        // --- Background Management ---
        function renderAdminBackgrounds() {
            const mgr = document.getElementById('bg-list-manager');
            if (!state.bgImages || state.bgImages.length === 0) {
                mgr.innerHTML = `<div class="text-center p-4 text-zinc-500 text-sm italic border border-dashed border-zinc-800 rounded-xl">No custom backgrounds.</div>`;
                return;
            }

            mgr.innerHTML = state.bgImages.map((b, i) => `
                <div class="flex items-center bg-zinc-900 p-2 rounded-xl border border-zinc-800 gap-3 transition-all duration-300 hover:-translate-y-1 hover:border-purple-500/30 hover:shadow-[0_5px_15px_rgba(0,0,0,0.3)]">
                    <div class="w-10 h-10 rounded-lg overflow-hidden shrink-0 border border-zinc-700">
                        <img src="${b.url}" class="w-full h-full object-cover">
                    </div>
                    <span class="flex-1 text-sm text-zinc-300 font-medium">Image ${i + 1}</span>
                    <button class="text-rose-500 hover:text-rose-400 p-2 transition shrink-0 hover:scale-110" onclick="deleteBackground('${b.url}')" title="Delete">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        async function uploadBackground() {
            const input = document.getElementById('bgUploadInput');
            const file = input.files[0];
            if (!file) return alert("Please select an image file first.");

            const btn = document.getElementById('uploadBgBtn');
            const loader = document.getElementById('uploadBgLoader');
            btn.disabled = true;
            loader.style.display = "inline-block";

            try {
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;

                const { data: uploadData, error: uploadError } = await _supabase.storage
                    .from('backgrounds')
                    .upload(fileName, file);

                if (uploadError) throw uploadError;

                const { data } = _supabase.storage.from('backgrounds').getPublicUrl(fileName);
                const publicUrl = data.publicUrl;

                const { data: insertData, error: insertError } = await _supabase
                    .from('background_images')
                    .insert([{ url: publicUrl }])
                    .select();

                if (insertError) throw insertError;

                state.bgImages.push(insertData ? insertData[0] : { url: publicUrl });
                input.value = ""; 
                renderAdminBackgrounds();
                initBackgroundRotation();

            } catch (error) {
                console.error(error);
                alert("Upload failed. Make sure you have created a public Storage bucket named 'backgrounds'.");
            } finally {
                btn.disabled = false;
                loader.style.display = "none";
            }
        }

        async function deleteBackground(url) {
            if (!confirm("Are you sure you want to delete this background?")) return;
            
            try {
                const fileName = url.split('/backgrounds/').pop();
                if (fileName && fileName !== url) {
                    await _supabase.storage.from('backgrounds').remove([fileName]);
                }
            } catch(e) { console.warn("Could not delete from storage bucket", e); }

            await _supabase.from('background_images').delete().eq('url', url);
            
            state.bgImages = state.bgImages.filter(b => b.url !== url);
            renderAdminBackgrounds();
            initBackgroundRotation();
        }

        // --- Link Management ---
        function renderAdminLinks() {
            const mgr = document.getElementById('link-list-manager');
            mgr.innerHTML = state.config.links.map((l, i) => `
                <div class="flex flex-col bg-zinc-900 p-3 rounded-xl border border-zinc-800 gap-2 mb-2 transition-all duration-300 hover:-translate-y-1 hover:border-purple-500/30 hover:shadow-[0_5px_15px_rgba(0,0,0,0.3)]">
                    <div class="flex items-center gap-2">
                        <input type="text" class="w-10 bg-zinc-950 border border-zinc-800 text-white rounded-lg text-center py-1.5 outline-none focus:border-purple-500 transition" value="${escapeHTML(l.icon) || '🔗'}" onchange="updateLinkIcon(${i}, this.value)" title="Change Emoji">
                        <span class="flex-1 text-sm text-zinc-200 font-medium truncate pl-1">${escapeHTML(l.title)}</span>
                        <div class="flex gap-1 shrink-0">
                            <button class="bg-zinc-800 hover:bg-zinc-700 text-zinc-400 p-1.5 rounded-lg transition disabled:opacity-30" onclick="moveLink(${i}, -1)" ${i === 0 ? 'disabled' : ''}><i data-lucide="chevron-up" class="w-3.5 h-3.5"></i></button>
                            <button class="bg-zinc-800 hover:bg-zinc-700 text-zinc-400 p-1.5 rounded-lg transition disabled:opacity-30" onclick="moveLink(${i}, 1)" ${i === state.config.links.length - 1 ? 'disabled' : ''}><i data-lucide="chevron-down" class="w-3.5 h-3.5"></i></button>
                        </div>
                        <button class="text-rose-500 hover:text-rose-400 p-2 transition shrink-0 hover:scale-110" onclick="removeLink(${i})" title="Delete">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <div class="text-[10px] text-purple-400 font-bold ml-[52px] uppercase tracking-widest flex items-center">
                        <i data-lucide="mouse-pointer-click" class="w-3 h-3 mr-1.5"></i> ${l.clicks || 0} clicks
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function updateLinkIcon(idx, newIcon) { state.config.links[idx].icon = newIcon || '🔗'; }

        function moveLink(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= state.config.links.length) return;
            const temp = state.config.links[index];
            state.config.links[index] = state.config.links[newIndex];
            state.config.links[newIndex] = temp;
            renderAdminLinks();
        }

        function removeLink(idx) { state.config.links.splice(idx,1); renderAdminLinks(); }
        
        function addLinkUI() {
            const i = document.getElementById('newLinkIcon').value || '🔗';
            const t = document.getElementById('newLinkTitle').value;
            const u = document.getElementById('newLinkUrl').value;
            if(!t || !u) return;
            
            state.config.links.push({title:t, url:u, icon: i, clicks: 0});
            
            document.getElementById('newLinkIcon').value = '';
            document.getElementById('newLinkTitle').value = '';
            document.getElementById('newLinkUrl').value = '';
            renderAdminLinks();
        }

        // --- View Navigation & Auth ---
        function switchView(v) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(v + 'View').classList.add('active');
            if(v === 'admin') loadAdminValues();
            
            // Scroll to top when switching views
            document.querySelector('.overflow-y-auto').scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function checkAuthAndShowAdmin() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                switchView('admin');
            } else {
                showGate();
            }
        }

        async function adminLogout() {
            await _supabase.auth.signOut();
            switchView('portal');
        }

        function showGate() { document.getElementById('gateModal').style.display = 'block'; }
        function hideGate() { 
            document.getElementById('gateModal').style.display = 'none'; 
            document.getElementById('adminEmail').value = "";
            document.getElementById('adminPass').value = ""; 
        }

        async function verifyAdmin() {
            const email = document.getElementById('adminEmail').value.trim();
            const pass = document.getElementById('adminPass').value;
            const loader = document.getElementById('gateLoader');
            
            if (!email || !pass) return alert("Please enter both email and password.");
            
            loader.style.display = "inline-block";
            
            try {
                const { data, error } = await _supabase.auth.signInWithPassword({
                    email: email,
                    password: pass
                });

                if (error) {
                    alert(error.message);
                } else if (data.session) {
                    hideGate();
                    switchView('admin');
                }
            } catch (e) { alert("Error connecting to authentication service"); }
            loader.style.display = "none";
        }

        async function saveAdminSettings() {
            const btn = document.getElementById('saveBtn');
            const loader = document.getElementById('saveLoader');
            
            const updates = [
                { key: 'PortalName', value: document.getElementById('setProfileName').value },
                { key: 'PortalBio', value: document.getElementById('setProfileBio').value },
                { key: 'SocialHandle', value: document.getElementById('setSocialHandle').value },
                { key: 'AvatarUrl', value: document.getElementById('setAvatarUrl').value },
                { key: 'LinksJson', value: JSON.stringify(state.config.links) }
            ];

            btn.disabled = true; loader.style.display = "inline-block";
            
            try {
                // Update Password if typed in
                const newPass = document.getElementById('setAdminPassword').value;
                if (newPass.trim() !== '') {
                    const { error: authError } = await _supabase.auth.updateUser({ password: newPass.trim() });
                    if (authError) throw new Error("Failed to update password: " + authError.message);
                }

                // Update DB Settings
                for (const item of updates) {
                    await _supabase
                        .from('portal_config')
                        .update({ value: item.value })
                        .eq('key', item.key);
                }
                location.reload();
            } catch (e) { 
                alert(e.message || "Save Failed"); 
                btn.disabled = false; 
                loader.style.display = "none"; 
            }
        }

        function initBackgroundRotation() {
            const container = document.getElementById('bg-container');
            if (!container) return; // Prevent JS error if container was removed from DOM

            if (state.bgRotationInterval) clearInterval(state.bgRotationInterval);

            if (!state.bgImages || state.bgImages.length === 0) {
                // Keep the default static background logic (don't clear it) if no DB images exist
                return;
            }

            container.innerHTML = state.bgImages.map((b, i) => `<div class="bg-slide ${i === 0 ? 'active' : ''}" style="background-image: url('${b.url}')"></div>`).join('');
            
            if(state.bgImages.length > 1) {
                state.bgIndex = 0;
                state.bgRotationInterval = setInterval(() => {
                    const slides = container.querySelectorAll('.bg-slide');
                    if (slides.length > 1) {
                        slides[state.bgIndex].classList.remove('active');
                        state.bgIndex = (state.bgIndex + 1) % slides.length;
                        slides[state.bgIndex].classList.add('active');
                    }
                }, 6000);
            }
        }
        
        // Initial setup for static icons
        lucide.createIcons();
    </script>
</body>
</html>
